services:
  shop:
    build: .
    container_name: smokindudesrecords-artist-shop
    restart: unless-stopped
    env_file:
      - .env.local
    networks:
      - proxy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:$${PORT}/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  proxy:
    external: true
