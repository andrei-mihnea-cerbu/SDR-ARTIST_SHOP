services:
  shop:
    build: .
    container_name: smokindudesrecords-artist-shop
    restart: unless-stopped
    env_file:
      - .env.local
    expose:
      - "3000"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s

networks:
  proxy:
    external: true
